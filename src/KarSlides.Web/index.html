<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title data-i18n="op.pageTitle">KarSlides – пульт</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="operator">
  <div class="app">
    <header class="topbar">
      <div class="brand"><img class="logo" src="/logo.png" alt="">KarSlides<span id="version" class="version"></span></div>
      <span id="conn" class="chip bad" data-i18n-title="op.connTitle"><span class="dot"></span></span>
      <span id="vmix" class="chip" data-i18n-title="op.vmixTitle"><span class="dot"></span>vMix ?</span>
      <button id="problemsChip" class="chip warn" hidden></button>
      <span class="spacer"></span>
      <div id="clicker" class="switch" role="switch" aria-checked="false" tabindex="0"
           data-i18n-title="op.clickerTitle">
        <span class="track"><span class="thumb"></span></span>
        <span><span class="label" data-i18n="op.clicker"></span><br><span class="hint" data-i18n="op.clickerHint"></span></span>
      </div>
      <div id="langSwitch" class="lang-switch"></div>
      <a id="settingsLink" class="btn text icon-only" href="/settings" data-i18n-title="op.settings"></a>
      <div id="problems" class="problems-panel"></div>
    </header>
    <main id="slots" class="slots"></main>
  </div>
  <script src="/i18n.js"></script>
  <script src="/common.js"></script>
  <script src="/operator.js"></script>
</body>
</html>
