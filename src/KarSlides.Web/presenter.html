<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title data-i18n="pr.pageTitle">KarSlides – спикер</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="presenter">
  <div class="presenter-grid">
    <div class="presenter-top">
      <span id="counter" class="counter-big">–</span>
      <span id="state" class="state-line"></span>
      <span class="spacer"></span>
      <span id="timer" class="timer">00:00</span>
      <div class="btn-group">
        <button id="timerToggle" class="btn filled" data-i18n-title="pr.toggleTitle"></button>
        <button id="timerReset" class="btn" data-i18n-title="pr.resetTitle"></button>
      </div>
      <span id="clock" class="clock">--:--</span>
      <div id="langSwitch" class="lang-switch"></div>
    </div>
    <div class="presenter-main">
      <div class="shot-box">
        <img id="current" class="shot" alt="">
        <img id="live" class="shot live" alt="">
      </div>
      <div class="label" data-i18n="pr.notes"></div>
      <div id="notes" class="notes empty"></div>
    </div>
    <div class="presenter-side">
      <div class="label" data-i18n="pr.nextSlide"></div>
      <img id="next" class="shot" alt="">
      <div id="nextNotes" class="next-notes"></div>
    </div>
  </div>
  <script src="/i18n.js"></script>
  <script src="/common.js"></script>
  <script src="/presenter.js"></script>
</body>
</html>
