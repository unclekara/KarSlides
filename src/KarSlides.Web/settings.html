<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title data-i18n="st.pageTitle">KarSlides – настройки</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="settings">
  <div class="settings-app">
    <header class="topbar">
      <a id="back" class="btn text icon-only" href="/" data-i18n-title="st.back"></a>
      <div class="brand"><img class="logo" src="/logo.png" alt=""><span data-i18n="st.title"></span><span id="version" class="version"></span></div>
      <span id="file" class="file-path"></span>
      <span class="spacer"></span>
      <span id="restartNote" class="chip warn" hidden data-i18n="st.restartNote"></span>
      <div id="langSwitch" class="lang-switch"></div>
      <button id="restart" class="btn outlined" data-i18n-title="st.restartTitle"></button>
      <button id="save" class="btn filled" disabled></button>
    </header>
    <main id="groups" class="settings-groups"></main>
    <footer id="about" class="about"></footer>
  </div>
  <div id="restarting" class="restarting" hidden>
    <div class="card">
      <h2 data-i18n="st.restarting"></h2>
      <p id="restartingText" data-i18n="st.restartingText"></p>
    </div>
  </div>
  <script src="/i18n.js"></script>
  <script src="/common.js"></script>
  <script src="/settings.js"></script>
</body>
</html>
